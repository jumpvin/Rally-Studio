<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Rally Studio 4 — Website Workspace</title><link rel="stylesheet" href="/studio4/styles.css"></head>
<body>
  <header class="topbar"><a class="brand" href="/studio4/index.html">Rally <span>Studio</span></a><div><small>Website Workspace</small><strong id="workspace-identity"></strong></div><a class="v3-link" href="/index.html">Open Studio v3 reference ↗</a></header>

  </main><script type="module" src="/studio4/app.js"></script>
</body></html>
